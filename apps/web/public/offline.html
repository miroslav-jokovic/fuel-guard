<!doctype html>
<!--
  Shown by the service worker when a page cannot be loaded for lack of a connection
  (docs/plans/messaging/INSTALLED-APP-PLAN.md D-IA2). No script: the site's Content-Security-Policy allows
  none inline, and none is needed — the link reloads the address that failed, and the refresh below tries
  again by itself. System colours only, so it is right in light and in dark without the app's stylesheet.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="20" />
    <meta name="color-scheme" content="light dark" />
    <title>Silvicom 360 — no connection</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: Canvas; color: CanvasText;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
      }
      img { width: 72px; height: 72px; }
      h1 { font-size: 20px; margin: 16px 0 4px; }
      p { margin: 0 0 20px; opacity: 0.75; max-width: 34ch; }
      a {
        display: inline-block; padding: 10px 20px; border-radius: 10px;
        border: 1px solid ButtonBorder; background: ButtonFace; color: ButtonText; text-decoration: none; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>No connection</h1>
      <p>Silvicom 360 needs the internet. This page tries again by itself every 20 seconds.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
