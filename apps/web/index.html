<!doctype html>
<html lang="en" class="h-full bg-canvas">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/SilvicomLogoS.svg" type="image/svg+xml" />
    <!-- `viewport-fit=cover` makes `env(safe-area-inset-*)` real: without it every inset reads 0 and, in the installed app on an iPhone, the shop's tab row and a walk's verb bar sat on the home bar (INSTALLED-APP-PLAN Q-IA6, owner's screenshot 2026-11-27). The body pads its sides by the inset so a phone held sideways keeps the page clear of the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installable, so a phone can add it to the Home Screen: on an iPhone that is the only way a browser
         login gets chat notifications (docs/plans/messaging/CHAT-WEB-PUSH-PLAN.md, D-WP5). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Silvicom" />
    <!-- The window's title bar continues the page: the canvas, per colour scheme, until the app has run
         and `useColorScheme` takes it over for the scheme the person chose (INSTALLED-APP-PLAN.md D-IA3).
         The two values are `--canvas`'s light and dark sides as sRGB. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121214" />
    <title>Silvicom 360</title>
  </head>
  <body class="h-full">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
