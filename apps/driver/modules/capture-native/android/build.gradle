plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.fuelguard.capturenative'
version = '0.1.0'

android {
  namespace 'expo.modules.capturenative'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // DCE §9: the doc-scanner module downloads on first use (needs connectivity once); scan() surfaces
  // SCANNER_MODULE_UNAVAILABLE when it is absent (de-Googled / enterprise-locked devices).
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'androidx.activity:activity-ktx:1.11.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
