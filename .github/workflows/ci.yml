name: CI

# ── Why this workflow is six jobs and not one ───────────────────────────────────────────────────
#
# Until 2026-09-05 every gate, every test and both builds ran as ~30 sequential steps in a single
# job, and a green run took 15.7 minutes wall clock. Measured on run 33942529999:
#
#     Test        704s     <- 75% of the run
#     Typecheck    71s
#     Build        62s
#     Lint         45s
#     all 20 other gates, together      ~30s
#
# The gates were never the problem and parallelising them would have bought seconds. Two things
# were: the test step did four independent bodies of work back to back, and a four-core runner sat
# three-quarters idle while it did. Splitting them onto their own runners turns a SUM into a MAX.
#
# `build` at the bottom is the aggregator, and its name is load-bearing: main's branch protection
# requires a check called exactly `build`. It is the only job that must keep that name — the others
# are free to be renamed.
#
# Nothing was dropped in the split. Every gate below is the same gate, in the same order, with the
# comment that records why it exists; the matrices are still DISCOVERED from disk by
# scripts/run-tests.mjs rather than listed here, and the non-api/web unit suites are selected by
# EXCLUSION, so a package added tomorrow is tested by this workflow without anyone editing it.

on:
  push:
    branches: [main]
  pull_request:

# Pushing twice to a PR used to leave both runs racing for the same four-core pool, so the one that
# mattered finished later than it needed to. Superseded PR runs are cancelled; main runs are NEVER
# cancelled, because migrate.yml gates production schema changes on the CI run for that exact SHA
# (.github/actions/require-ci-green) and a cancelled run reads to it as a failed deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Static gates ──────────────────────────────────────────────────────────────────────────────
  # Every check that reads source and answers in seconds. They share a runner because together they
  # are ~95s; giving each its own would spend more on runner start-up than the checks themselves
  # cost, and would turn one red X into twenty.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration-ordering gate diffs this change against the base it will merge into, so it
          # needs history rather than the default single commit. Everything else is unaffected.
          fetch-depth: 0

      # Audit 2026-08-09 finding 3.7: nothing in this repository would have noticed a committed
      # credential. Runs before install so a leak fails in seconds rather than after a full build.
      # Scans `git archive HEAD` (tracked content only) via scripts/scan-secrets.mjs, so an
      # untracked local .env never false-alarms while a committed one fails the build.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Invoked as plain node, not `pnpm lint:secrets`, so it still runs before the workspace is set
      # up at all — scripts/scan-secrets.mjs imports nothing but node builtins. Same check, same
      # script, and the "fails in seconds rather than after a full build" property above survives
      # the 2026-09-05 split into jobs.
      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: File-size budget
        run: pnpm lint:filesize

      - name: Function-size budget
        run: pnpm lint:funcsize

      - name: Migration versions
        run: pnpm lint:migrations

      # P6 (EDITABLE-PERMISSIONS-PLAN.md, D-PERM13). Every new table has RLS, and every role list in a
      # policy above the 0260 boundary equals its section's derived set or is waived by name. Chained
      # in package.json as lint:rls; it was never in this workflow, which is how the section half ran
      # blind for seven migrations.
      - name: RLS and section policies
        run: pnpm lint:rls

      # Only on a pull request, and that is the point: this gate exists to STOP a merge that would
      # serve code against a schema it has not got yet. On a push to main the merge has already
      # happened and the deploy is already running, so failing there would paint main red over
      # something nobody can now prevent. The self-test runs on both events, so a broken detector is
      # still caught. See scripts/check-migration-ordering.mjs and docs/MIGRATION-DISCIPLINE.md.
      - name: Migration ordering self-test
        run: node scripts/check-migration-ordering.mjs --self-test

      - name: Migration ordering (column and its first reader in one merge)
        if: github.event_name == 'pull_request'
        env:
          MIGRATION_ORDERING_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-migration-ordering.mjs

      # Fleet MPG has ONE definition. Four implementations of the same one landed without anyone
      # being asked, and the pages they drove disagreed by 10.7% on the same week — see
      # docs/plans/fuel/FLEET-MPG-CONSOLIDATION-PLAN.md. The self-test runs with it so a detector
      # that stops firing is caught rather than silently passing everything.
      - name: One fleet-MPG definition
        run: pnpm lint:mpg

      - name: Upsert-as-update guard
        run: pnpm lint:upserts

      # Audit 2026-08-09 finding 5.2: a test file that is never collected reads as coverage it has
      # not earned. This repo had shipped that bug three times before anything checked for it.
      - name: Test collection
        run: pnpm lint:tests

      # Added 2026-09-05. The sibling of the gate above: that one catches a test nobody RUNS, this
      # one catches a matrix that runs and then refuses to end. 21 of 59 held their PGlite open on
      # the green path and cost ~10s each doing nothing — ~210s of every run, invisible because they
      # still passed and printed the right counts. The self-test runs with it, per house rule.
      - name: Matrices release their database
        run: pnpm lint:matrix-exit

      - name: Design tokens
        run: pnpm --filter ./apps/web lint:tokens

      - name: Token parity (web ↔ packages/ui)
        run: pnpm lint:tokens-parity

      - name: UI semantic contrast
        run: pnpm lint:ui-contrast

      - name: Chart color vision and contrast
        run: pnpm lint:chart-colors

      - name: UI component adoption
        run: pnpm lint:ui-adoption

      - name: Feature boundaries
        run: pnpm lint:boundaries

      # Added 2026-08-31 (R9; D-ROS2/D-ROS7/D-ROS11). `canManageFleet` was one boolean standing in
      # for an 11-section x 8-role matrix, and every workaround the roster plan removed was
      # downstream of it. This keeps it deleted, keeps `requiresManage` naming a section, and stops
      # a third driver-editing surface hand-picking its own fields.
      - name: Capability decisions
        run: pnpm lint:capabilities

      # The surface catalogue is only worth having while nothing drifts away from it. Its own step
      # rather than a chain onto another gate, because the failure it catches — a permission that
      # grants access to a route that does not exist, or an icon map that has quietly become a
      # second copy of the catalogue — reads as nothing at all in a combined summary line.
      - name: Surface catalogue
        run: pnpm lint:surfaces

      # `lint:comment-claims` has existed in package.json since the comment discipline was written
      # and has never been run by CI — a gate nobody executes is a gate that is not there. It was
      # found on 2026-09-02 by running it by hand: the repo was clean except for one comment added
      # that same day, which named a test file the checker could not resolve. Turned on at one
      # violation, which is the only moment turning a gate on is cheap.
      - name: Comment proof-claims cite real tests
        run: pnpm lint:comment-claims

      # Added 2026-08-26 (re-founding, docs/ARCHITECTURE.md §6). Four tables merged two days
      # earlier with zero application code; this would have failed that merge.
      - name: Every table has a producer
        run: pnpm lint:table-producers

      # Added 2026-08-26 (D-ARC3). fuel_transactions reached 35 writing files silently; from now
      # on a new write site is a deliberate, reviewed manifest edit in the same PR.
      - name: No new table writers
        run: pnpm lint:table-writers

      # Regenerates the rule catalogue AND packages/ui/src/tokens.generated.css from their DTCG
      # sources, then fails if either differs from what was committed. It had existed since the
      # codegen work but was never wired in here, so for its whole life it enforced nothing —
      # including for the *.generated.ts files it was written for (found 2026-08-23, D-DS3).
      - name: Generated output matches its sources
        run: pnpm lint:codegen

      # The 14 role names apps/web and apps/driver genuinely share. Of 61 web roles and 33 driver
      # roles only those overlap; the gate pins the shared neutral ground rather than pretending the
      # two schemas match (D-DS3b).
      - name: Shared token vocabulary
        run: pnpm lint:token-schema

      # Added 2026-08-16. `efs.mjs` wrote its token prompt to stdout, so the documented
      # `efs.mjs inventory > docs/efs/…json` swallowed the prompt and sat waiting on stdin —
      # indistinguishable from a hung command, and it read as one for five minutes.
      - name: Operator CLI stream discipline
        run: pnpm lint:cli-streams

  # ── Types and the production bundle ───────────────────────────────────────────────────────────
  # These two stay together because the third step needs the second one's output: lint:light-dark
  # reads apps/web/dist, which only exists after a build.
  typecheck-build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Deliberately AFTER the build. Lightning CSS transpiles light-dark() into a
      # prefers-color-scheme polyfill by default, which follows the OS and cannot be reached by the
      # in-app scheme toggle — so light mode silently did nothing. Every other gate reads SOURCE css,
      # where light-dark() is present and correct; only the built output shows the defect, which is
      # why this step needs dist to exist (2026-08-23, D-DS2).
      - name: light-dark() survives minification
        run: pnpm lint:light-dark

  # ── Unit suites, three ways ───────────────────────────────────────────────────────────────────
  # apps/api (259 files) and apps/web (146) are the two big ones, and they are import-bound rather
  # than assertion-bound: on run 33942529999 api spent 601s importing modules and 105s running
  # tests. Under the old single job they ran CONCURRENTLY on the same four cores and took 266s and
  # 260s respectively — each one starving the other. A runner apiece removes the contention.
  #
  # `isolate: false` was measured on 2026-09-05 as the obvious alternative and rejected: it hangs
  # apps/api indefinitely (>5 min against an 18s baseline), because suites here rely on a fresh
  # module registry per file. Do not reach for it again without fixing that first.
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-shared: "false"
      - name: apps/api unit suites
        run: pnpm --filter @silvicom/api test

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-shared: "false"
      - name: apps/web unit suites
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-test-anon-key
        run: pnpm --filter @silvicom/web test

  # Everything else, selected by EXCLUSION rather than by name. A hand-written list of the other
  # twelve packages would be a second source of truth about what this repo contains, and the day
  # somebody adds the thirteenth its suites would simply never run — the same shape of bug
  # `lint:tests` exists to catch one level down, at the file.
  test-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Every other workspace's unit suites
        run: pnpm -r --filter '!@silvicom/api' --filter '!@silvicom/web' test

  # ── Behavioural matrices ──────────────────────────────────────────────────────────────────────
  # Still one process running every matrix it finds on disk, because that discovery is the whole
  # point of scripts/run-tests.mjs and sharding them across runners would reintroduce exactly the
  # failure it was written to prevent: a matrix that nobody notices stopped running. They now run
  # concurrently WITHIN the job instead, bounded by core count.
  matrices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # build-shared stays ON here, and it is not obvious why: `@silvicom/shared` resolves to src
      # through its exports map, so nothing in supabase/tests/ appears to need a build. One matrix -
      # fuel-range-miles-inputs - reaches past the package name and imports
      # `../../packages/shared/dist/index.js` by relative path, deliberately, to assert the SQL
      # against the same compiled function the driver app runs. Turning this off failed exactly that
      # one matrix on the first run of this split (2026-09-05).
      - uses: ./.github/actions/setup
      - name: Behavioural matrices (PGlite)
        run: pnpm test:rls

  # ── The required check ────────────────────────────────────────────────────────────────────────
  # main's branch protection requires a status check named `build`. Before the split that was the
  # single job; now it is this one, which does no work and exists only so that one name still means
  # "all of CI passed". `if: always()` plus the explicit result check is deliberate — without it a
  # cancelled or skipped dependency would leave this job skipped, and a skipped required check reads
  # to branch protection as nothing at all rather than as a failure.
  build:
    if: always()
    needs: [gates, typecheck-build, test-api, test-web, test-packages, matrices]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::At least one CI job did not succeed ($RESULTS)."
              exit 1
            fi
          done
          echo "All CI jobs succeeded."
