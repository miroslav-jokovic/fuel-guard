name: Apply Supabase migrations

# Auto-applies database migrations to the production Supabase project whenever a migration file
# changes on main — mirroring the way Railway auto-deploys the app. Also runnable on demand.
#
# Requires three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token (Supabase dashboard → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   — the project ref (Project Settings → General → Reference ID)
#   SUPABASE_DB_PASSWORD   — the database password you set when creating the project
# The job ASSERTS all three up front. It used to "fail harmlessly" without them, which is how a
# migration can appear to have shipped while the database sat untouched for weeks — the failure mode
# that produced the 2026-08-07 "why don't I see my changes?" investigation. Silence is the bug.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert the Supabase secrets exist
        run: |
          missing=()
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ] && missing+=(SUPABASE_PROJECT_REF)
          [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ] && missing+=(SUPABASE_DB_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} — migrations were NOT applied."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Apply migrations (only ones not yet applied)
        run: supabase db push
      - name: Report the applied version
        run: supabase migration list --linked | tail -20
