name: Apply Supabase migrations

# Auto-applies database migrations to the production Supabase project whenever a migration file
# changes on main — mirroring the way Railway auto-deploys the app. Also runnable on demand.
#
# Requires three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token (Supabase dashboard → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   — the project ref (Project Settings → General → Reference ID)
#   SUPABASE_DB_PASSWORD   — the database password you set when creating the project
# The job ASSERTS all three up front. It used to "fail harmlessly" without them, which is how a
# migration can appear to have shipped while the database sat untouched for weeks — the failure mode
# that produced the 2026-08-07 "why don't I see my changes?" investigation. Silence is the bug.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if CI has not passed (incident recovery only)"
        type: boolean
        required: false
        default: false

jobs:
  migrate:
    # Once RELEASE_TRAIN is `on` (RELEASE-TRAIN-PLAN R5), a merge no longer touches production's
    # schema: release.yml applies migrations there at 01:00, before the code it ships. A dispatch
    # still runs — incident recovery is exactly when production must be reachable by hand.
    if: ${{ github.event_name != 'push' || vars.RELEASE_TRAIN != 'on' }}
    # Same machine switch as ci.yml (CI_RUNNER; its header says why).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read # the CI gate reads workflow run status
      statuses: read   # CI gate reads the ci/tested-tree status a PR run left
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Audit 2026-08-09 finding 3.1: this workflow used to run in parallel with CI, so a push
      # with a red test suite still applied migrations to production. Fail closed instead.
      - name: Require CI green for this commit
        uses: ./.github/actions/require-ci-green
        with:
          bypass: ${{ github.event.inputs.force || 'false' }}

      - name: Assert the Supabase secrets exist
        run: |
          missing=()
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ] && missing+=(SUPABASE_PROJECT_REF)
          [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ] && missing+=(SUPABASE_DB_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} — migrations were NOT applied."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Apply migrations (only ones not yet applied)
        run: supabase db push
      - name: Report the applied version
        run: supabase migration list --linked | tail -20

  # ── Staging gets every migration too (RELEASE-TRAIN-PLAN R3, D-REL3) ─────────────────────────────
  # Staging is a separate Supabase project (`Silvicom 360 Staging`, created 2026-10-02) that the
  # Railway `uat` services read. It follows `main` so the day's work can be checked the same day;
  # production keeps following the job above until R5 moves it onto the nightly release. Same CI
  # gate and same CLI pin as production, so a migration that cannot apply fails HERE first once R5
  # puts staging ahead of production in time.
  #
  # Its own secrets, asserted the same way: STAGING_SUPABASE_PROJECT_REF, STAGING_SUPABASE_DB_PASSWORD
  # (SUPABASE_ACCESS_TOKEN is the same account token — one org owns both projects).
  migrate-staging:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
      statuses: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require CI green for this commit
        uses: ./.github/actions/require-ci-green
        with:
          bypass: ${{ github.event.inputs.force || 'false' }}

      - name: Assert the staging secrets exist
        run: |
          missing=()
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "${{ secrets.STAGING_SUPABASE_PROJECT_REF }}" ] && missing+=(STAGING_SUPABASE_PROJECT_REF)
          [ -z "${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}" ] && missing+=(STAGING_SUPABASE_DB_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} — staging migrations were NOT applied."
            exit 1
          fi
      # The two refs must differ. One pasted value away from this job applying to production
      # twice while staging silently falls behind — fail it instead.
      - name: Assert staging is not production
        run: |
          if [ "${{ secrets.STAGING_SUPABASE_PROJECT_REF }}" = "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF equals SUPABASE_PROJECT_REF — refusing."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Link staging project
        run: supabase link --project-ref "${{ secrets.STAGING_SUPABASE_PROJECT_REF }}"
      - name: Apply migrations (only ones not yet applied)
        run: supabase db push
      - name: Report the applied version
        run: supabase migration list --linked | tail -20
