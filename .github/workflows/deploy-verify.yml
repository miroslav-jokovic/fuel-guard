name: Verify deployment

# Closes the loop that was missing entirely (ship-pipeline plan D4): after a push to main, confirm
# that Railway is actually serving THIS commit and that Supabase is at the migration version this
# commit expects. Without this, a failed deploy is silent — the repository looks shipped, the app
# behaves as if nothing changed, and the only way to find out is to probe by hand.
#
# ── Step 5.10: BOTH hosts, because there are two ────────────────────────────────────────────────
# Two Railway services deploy independently from this repository: `fleetguardapi` (whitelisted by
# WEX, reaches EFS, the pollers run there) and `fleetguardweb` (the SPA plus a full copy of the API).
# This workflow polled only API_URL, so on 2026-08-14 it reported success for 34f7336 while the web
# host was two commits behind — a green deploy check on a half-deployed system, which is worse than
# no check at all because it is believed.
#
# Both are polled now, and either one lagging fails the job. They are polled CONCURRENTLY rather
# than one after the other: sequentially, a slow first host eats the second one's budget and the
# failure message blames whichever host happened to be checked second.
#
# Requires two repository variables (not secrets — they are public URLs):
#   API_URL   e.g. https://fleetguardapi-production.up.railway.app
#   WEB_URL   e.g. https://fleetguardweb-production.up.railway.app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    # Same machine switch as ci.yml (CI_RUNNER; its header says why).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      # Report on every host rather than stopping at the first one that lags. "The API is behind" and
      # "the web host is behind" are different problems with different fixes, and learning them one
      # deploy at a time is the same two-round-trips mistake the promotion gate was fixed for.
      fail-fast: false
      matrix:
        include:
          - host: api
            url_var: API_URL
          - host: web
            url_var: WEB_URL
    steps:
      - uses: actions/checkout@v4

      - name: Check the URL is configured
        env:
          TARGET_URL: ${{ vars[matrix.url_var] }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "::error::Repository variable ${{ matrix.url_var }} is not set — cannot verify the ${{ matrix.host }} host."
            echo "Both hosts must be verifiable. A missing variable is an unverified deployment, not a skip."
            exit 1
          fi

      # ── Only when Railway will deploy this commit at all (2026-09-30) ─────────────────────────────
      # railway.json's watchPatterns tell Railway which paths are worth a deploy; a push touching only
      # the rest (docs, *.md, .github, the driver app, tests) builds nothing, and the hosts correctly
      # stay on the previous commit. This job used to wait for them anyway and fail: of 339 runs on
      # main from 2026-09-16 to 09-30, 60 of the 78 failures were commits with nothing to deploy — so
      # a red run here meant nothing, and the real ones were lost among them.
      #
      # The patterns are READ from railway.json, never restated: a copy here would be right until
      # the day somebody edits one list and not the other. Each becomes a git pathspec — `X` to
      # `:(glob)X`, `!X` to `:(exclude,glob)X` — and the push is diffed against them. Railway calls its
      # patterns gitignore-style, where a slash-less pattern like `.gitignore` matches at any depth;
      # git's glob anchors it at the root instead. That difference can only make this job WAIT for a
      # deploy of a nested .gitignore that never comes — the old false alarm, never a skipped check.
      #
      # Anything unexpected — a workflow_dispatch (no `before`), a branch's first push, a fetch that
      # fails — falls through to verifying, as before.
      - name: Does this push change anything Railway deploys?
        id: deploys
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -o pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git fetch --no-tags --depth=1 origin "$BEFORE"; then
            echo "No usable previous commit — verifying."
            echo "deploys=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          specs=()
          while IFS= read -r spec; do specs+=("$spec"); done < <(jq -r '(.build.watchPatterns // [])[]
            | if startswith("!") then ":(exclude,glob)" + .[1:] else ":(glob)" + . end' railway.json)
          if ! changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- "${specs[@]}"); then
            echo "Could not diff ${BEFORE::7}..${GITHUB_SHA::7} — verifying."
            echo "deploys=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$changed" ]; then
            echo "Railway deploys this push; it changes:"
            echo "$changed" | sed 's/^/  /'
            echo "deploys=true" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Nothing to deploy: ${BEFORE::7}..${GITHUB_SHA::7} touches only paths railway.json's watchPatterns exclude."
            echo "✓ Nothing to deploy — \`${GITHUB_SHA::7}\` touches only paths railway.json's watchPatterns exclude." >> "$GITHUB_STEP_SUMMARY"
            echo "deploys=false" >> "$GITHUB_OUTPUT"
          fi

      # Railway builds and migrations both take a few minutes; poll rather than guess a sleep.
      #
      # A host serving a LATER commit of main also passes (2026-09-30). When the next merge lands
      # while this job is still waiting, Railway deploys that one instead, and the host never serves
      # this exact SHA — 12 of the 18 remaining failures in the window above were that, the next
      # merge 0–14 minutes behind. What is live then contains this commit, so this commit is
      # deployed; the later commit's own run still verifies the later commit. "Later" is asked of
      # GitHub's compare API (`ahead` = live descends from this commit), so a host that is on some
      # OTHER branch's commit, or behind, still fails.
      - name: Wait for the ${{ matrix.host }} host to serve this commit
        if: steps.deploys.outputs.deploys == 'true'
        env:
          TARGET_URL: ${{ vars[matrix.url_var] }}
          EXPECTED: ${{ github.sha }}
          HOST: ${{ matrix.host }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 900 ))
          checked="" contains=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -sS --max-time 15 "${TARGET_URL%/}/api/version" || echo '{}')
            live=$(echo "$body" | jq -r '.commit // empty')
            schema=$(echo "$body" | jq -r '.schema.state // "unknown"')
            echo "[$HOST] live=${live:-none} schema=${schema}"
            if [ -n "$live" ] && [ "$live" != "$EXPECTED" ] && [ "$live" != "$checked" ]; then
              checked="$live"
              rel=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED}...${live}" --jq .status 2>/dev/null || echo unknown)
              echo "  live is ${rel} of ${EXPECTED::7}"
              contains=$([ "$rel" = "ahead" ] && echo yes || echo "")
            fi
            if [ "$live" = "$EXPECTED" ] || { [ "$live" = "$checked" ] && [ -n "$contains" ]; }; then
              if [ "$schema" = "current" ]; then
                if [ "$live" = "$EXPECTED" ]; then
                  echo "✓ ${TARGET_URL} is serving ${EXPECTED::7} with a matching schema."
                else
                  echo "✓ ${TARGET_URL} is serving ${live::7}, a later commit of main that contains ${EXPECTED::7}, with a matching schema."
                  echo "✓ [${HOST}] superseded: serving \`${live::7}\`, which contains \`${EXPECTED::7}\`." >> "$GITHUB_STEP_SUMMARY"
                fi
                exit 0
              fi
              echo "  commit matches; waiting for migrations (schema=${schema})"
            fi
            sleep 20
          done
          echo "::error::Timed out. The ${HOST} host never caught up with ${EXPECTED::7}."
          echo "Check the Railway deploy log for ${HOST} and the 'Apply Supabase migrations' workflow run for this commit."
          exit 1
