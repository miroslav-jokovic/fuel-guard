name: Production smoke test

# Phase 9 deploy verification. Requires repository variable API_URL, for example:
# https://fleetguardweb-production.up.railway.app
#
# Since the release train (RELEASE-TRAIN-PLAN R5): release.yml calls this after verifying production.
# The workflow_run chain off "Verify deployment" stops once RELEASE_TRAIN is `on` — a push to main then
# deploys staging, not production, and smoke-testing an unchanged production would prove nothing.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Verify deployment"]
    types: [completed]
  workflow_call:
    inputs:
      from_release:
        type: boolean
        required: false
        default: true

jobs:
  smoke:
    if: ${{ inputs.from_release || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.RELEASE_TRAIN != 'on') }}
    # Same machine switch as ci.yml (CI_RUNNER; its header says why).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      # The address the office opens (WEB_URL = https://360.silvicominc.com since AWS11), not the api
      # host. On Railway one service served both, so API_URL stood in for it; on AWS Caddy routes the
      # two names to different containers (web vs api), and the smoke test was opening the api's copy
      # of the pages — passing while the page people use went untested (2026-10-27).
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require production URL
        run: |
          if [ -z "$WEB_URL" ]; then
            echo "::error::Repository variable WEB_URL is not set — cannot run production smoke tests."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile --prod=false
      # Time-boxed and retried: on 2026-10-27 this same install hung for ~40 min in CI, twice. Here a hang
      # would run out the job's 15 minutes, fail smoke, and auto-rollback a healthy release.
      - name: Install Chromium
        run: bash scripts/install-chromium.sh "${{ runner.os == 'Linux' && '--with-deps' || '' }}"
      - name: Run unauthenticated smoke tests
        env:
          BASE_URL: ${{ env.WEB_URL }}
        run: pnpm --filter ./apps/web e2e --project=chromium
