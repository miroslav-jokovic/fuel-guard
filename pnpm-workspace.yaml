packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: false
  vue-demi: false
# Patched versions of libraries nothing here depends on directly, so no `package.json` can ask for them
# (security audit 2026-11-15, docs/plans/messaging/INSTALLED-APP-PLAN.md §5a, IA11). Each is the newest release
# of the line its parent already uses — no major version moves here. Remove an entry when its parent
# (express, express-rate-limit, soap, exceljs) asks for a fixed version by itself.
overrides:
  "proxy-addr@2": "2.0.8"
  "body-parser@2": "2.4.0"
  "qs@6": "6.17.1"
  "ip-address@10": "10.7.6"
  "axios@1": "1.21.1"
  "follow-redirects@1": "1.16.3"
  "@xmldom/xmldom@0.8": "0.8.15"
  "brace-expansion@1": "1.1.22"
  "brace-expansion@2": "2.1.8"
  # Under vue's template compiler (@vue/compiler-sfc, @vue/compiler-core), which asks for them by range; build
  # time only. Remove when a vue release asks for these by itself (advisory check, 2026-11-15).
  "postcss@8": "8.5.33"
  "nanoid@3": "3.3.20"
  "source-map-js@1": "1.2.2"
