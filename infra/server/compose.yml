# The stack one EC2 server runs (docs/plans/architecture/AWS-MIGRATION-PLAN.md, D-AWS8/D-AWS9, AWS6).
# deploy.sh copies this file out of the app image of the commit being deployed, so the stack and the
# code always come from the same commit. Per-server values (hosts, replica count, drain) come from
# <env>.env beside it, the release's images from release.env; secrets come from Parameter Store into
# /run/silvicom/<service>.env (fetch-settings.sh), mounted read-only into each container.
#
# Not here, by D-AWS16: the OTA server and its database (AWS8) and the driver install page (AWS9) —
# the driver app goes to the stores and both are switched off on Railway instead.

name: silvicom

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
  restart: unless-stopped
  # Railway gives each deploy RAILWAY_DEPLOYMENT_DRAINING_SECONDS between SIGTERM and SIGKILL and
  # lib/shutdown.ts reads the same variable for its drain budget, so the two cannot disagree. Here
  # Docker's grace period plays Railway's part, set from the same number. The variable keeps
  # Railway's name because that is what the code reads; renaming it is AWS12's clean-up.
  stop_grace_period: ${DRAIN_SECONDS:?}s
  # Changed settings recreate the container; without this a rotated secret waited for the next
  # commit (fetch-settings.sh says why).
  labels:
    silvicom.settings: ${SETTINGS_HASH:?SETTINGS_HASH is set by deploy.sh and boot.sh}
  healthcheck:
    # The image is slim (no curl); node is always there. /healthz must stay 200 (DEPLOYMENT.md).
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    start_period: 60s
    retries: 3
  logging: &logs
    driver: awslogs
    options:
      awslogs-region: us-west-2
      awslogs-group: /silvicom/${ENV_NAME:?}
      tag: "{{.Name}}"

services:
  api:
    <<: *app
    # Q-AWS14 (b): the settings file is mounted, not passed as environment, so Docker stores only
    # this path. `create_host_path: false` makes a missing file (an empty tmpfs after a reboot,
    # before silvicom-boot.service has run) stop the container instead of starting it unconfigured.
    volumes:
      - type: bind
        source: /run/silvicom/api.env
        target: /run/settings.env
        read_only: true
        bind:
          create_host_path: false
    environment:
      DOTENV_CONFIG_PATH: /run/settings.env
      DOTENV_CONFIG_QUIET: "true"
      PORT: "8080"
      RAILWAY_DEPLOYMENT_DRAINING_SECONDS: ${DRAIN_SECONDS}
      # Until this server's cutover (AWS10 staging, AWS11 production) Railway keeps the scheduler
      # lanes: an AWS container that won the `egress` lease would poll WEX from an IP WEX has not
      # allowlisted yet. The lease would keep it to one poller either way (D-AWS8); this keeps it
      # on the host that works. <env>.env sets RUN_SCHEDULERS=true at cutover.
      RUN_SCHEDULERS_IN_PROCESS: ${RUN_SCHEDULERS:?}
      # D-RLY2's production shape: the api containers take only `egress` (the EFS work) and the
      # worker below takes `general`, so the HTTP processes carry no general scheduler work. On one
      # server every container leaves from the same Elastic IP, so WEX and Med-Stop (D-MS3) see one
      # address whichever container runs a lane — the split here is about load, not about IPs.
      SCHEDULER_LANES: egress
    deploy:
      replicas: ${API_REPLICAS:?}

  # The `general` lane (RLY6/RLY7's @fleetguard/worker, railway.worker.json). Same image and settings
  # file as api (the runbook's "copy api's variables"), its own start command.
  #
  # ⚠ worker.ts does not read RUN_SCHEDULERS_IN_PROCESS: a `scheduler` worker competes for its lanes
  # from the moment it starts. So the switch is how many copies run — deploy.sh derives
  # WORKER_REPLICAS from RUN_SCHEDULERS (0 until cutover). A worker started earlier could win
  # `general` from Railway and call Med-Stop from an address Med-Stop has not bound the key to.
  worker:
    <<: *app
    command: ["node", "--import", "tsx", "apps/api/src/worker.ts"]
    # No HTTP server, so no /healthz to ask. compose's --wait then waits for "running"; a crash
    # restarts it (restart: unless-stopped), as Railway's restartPolicyType ALWAYS did.
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: /run/silvicom/api.env
        target: /run/settings.env
        read_only: true
        bind:
          create_host_path: false
    environment:
      DOTENV_CONFIG_PATH: /run/settings.env
      DOTENV_CONFIG_QUIET: "true"
      RAILWAY_DEPLOYMENT_DRAINING_SECONDS: ${DRAIN_SECONDS}
      WORKER_ROLE: scheduler
      SCHEDULER_LANES: general
      # Belt and braces from the runbook: the SOAP poller is `egress`, which this process never
      # competes for, and this keeps it off even if the lane list is ever edited wrongly.
      EFS_SOAP_ENABLED: "false"
    deploy:
      replicas: ${WORKER_REPLICAS:?WORKER_REPLICAS is set by deploy.sh from RUN_SCHEDULERS}

  web:
    <<: *app
    # Q-AWS14 (b): the settings file is mounted, not passed as environment, so Docker stores only
    # this path. `create_host_path: false` makes a missing file (an empty tmpfs after a reboot,
    # before silvicom-boot.service has run) stop the container instead of starting it unconfigured.
    volumes:
      - type: bind
        source: /run/silvicom/web.env
        target: /run/settings.env
        read_only: true
        bind:
          create_host_path: false
    environment:
      DOTENV_CONFIG_PATH: /run/settings.env
      DOTENV_CONFIG_QUIET: "true"
      PORT: "8080"
      RAILWAY_DEPLOYMENT_DRAINING_SECONDS: ${DRAIN_SECONDS}
      RUN_SCHEDULERS_IN_PROCESS: "false" # the front door never runs schedulers (DEPLOYMENT.md)

  console:
    image: ${CONSOLE_IMAGE:?CONSOLE_IMAGE is set by deploy.sh}
    labels:
      silvicom.settings: ${SETTINGS_HASH:?SETTINGS_HASH is set by deploy.sh and boot.sh}
    restart: unless-stopped
    # Q-AWS14 (b): the settings file is mounted, not passed as environment, so Docker stores only
    # this path. `create_host_path: false` makes a missing file (an empty tmpfs after a reboot,
    # before silvicom-boot.service has run) stop the container instead of starting it unconfigured.
    volumes:
      - type: bind
        source: /run/silvicom/console.env
        target: /run/settings.env
        read_only: true
        bind:
          create_host_path: false
    environment:
      DOTENV_CONFIG_PATH: /run/settings.env
      DOTENV_CONFIG_QUIET: "true"
      PORT: "8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging: *logs

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_HOST: ${WEB_HOST:?}
      API_HOST: ${API_HOST:?}
      CONSOLE_HOST: ${CONSOLE_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive a redeploy; losing them would mean re-issuing on every deploy and
      # running into Let's Encrypt's rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      console:
        condition: service_healthy
    logging: *logs

volumes:
  caddy_data:
  caddy_config:
