# The stack one EC2 server runs (docs/plans/architecture/AWS-MIGRATION-PLAN.md, D-AWS8/D-AWS9, AWS6).
# deploy.sh copies this file out of the app image of the commit being deployed, so the stack and the
# code always come from the same commit. Per-server values (hosts, replica count, drain) come from
# <env>.env beside it, the release's images from release.env; secrets come from Parameter Store into
# /run/silvicom/<service>.env (fetch-settings.sh), mounted read-only into each container.
#
# Not here, by D-AWS16: the OTA server and its database (AWS8) and the driver install page (AWS9) —
# the driver app goes to the stores and both are switched off on Railway instead.

name: silvicom

# Container hardening, the same for every service (D-AWS14's "the server is built from code" applied
# to what runs on it; found missing by the 2026-10-24 audit of the staging host, where every
# container ran with a writable root, the default capability set and no new-privileges guard).
#   read_only           — the image is the code (D-AWS6); a process that can rewrite it is a process
#                         an attacker can persist in. Each service names the few paths it writes.
#   no-new-privileges   — no setuid/setgid or file-capability escalation inside the container, so a
#                         bug in Node or Caddy stays the user it started as.
#   cap_drop ALL        — the app containers run as `node` (uid 1000, the image's USER) and need no
#                         capability at all; Caddy gets exactly one back (NET_BIND_SERVICE, below).
x-hardened: &hardened
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
  restart: unless-stopped
  # Railway gives each deploy RAILWAY_DEPLOYMENT_DRAINING_SECONDS between SIGTERM and SIGKILL and
  # lib/shutdown.ts reads the same variable for its drain budget, so the two cannot disagree. Here
  # Docker's grace period plays Railway's part, set from the same number. The variable keeps
  # Railway's name because that is what the code reads; renaming it is AWS12's clean-up.
  stop_grace_period: ${DRAIN_SECONDS:?}s
  # Changed settings recreate the container; without this a rotated secret waited for the next
  # commit (fetch-settings.sh says why).
  labels:
    silvicom.settings: ${SETTINGS_HASH:?SETTINGS_HASH is set by deploy.sh and boot.sh}
  healthcheck:
    # The image is slim (no curl); node is always there. /healthz must stay 200 (DEPLOYMENT.md).
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    start_period: 60s
    retries: 3
  <<: *hardened
  # The only paths a Node container writes (measured with `docker diff` on staging, 2026-10-24: api
  # and web 25 MB, console 3 MB, all of it tsx's compile cache under /tmp/tsx-1000; nothing else on
  # the whole filesystem). So /tmp is a bounded tmpfs and the rest of the root is read-only. The one
  # other writer, the OCR model cache (~139 MB, ocr/ocrModels.ts), gets a disk directory below rather
  # than RAM, and anything that still asks os.tmpdir() lands here. The size is a ceiling, not a
  # reservation — a tmpfs takes memory only for what is written.
  tmpfs:
    - /tmp:size=256m,mode=1777
  logging: &logs
    driver: awslogs
    options:
      awslogs-region: us-west-2
      awslogs-group: /silvicom/${ENV_NAME:?}
      tag: "{{.Name}}"

services:
  api:
    <<: *app
    # Q-AWS14 (b): the settings file is mounted, not passed as environment, so Docker stores only
    # this path. `create_host_path: false` makes a missing file (an empty tmpfs after a reboot,
    # before silvicom-boot.service has run) stop the container instead of starting it unconfigured.
    volumes:
      - type: bind
        source: /run/silvicom/api.env
        target: /run/settings.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/silvicom/ocr-models
        target: /var/cache/silvicom/ocr-models
        bind:
          create_host_path: false
    environment:
      DOTENV_CONFIG_PATH: /run/settings.env
      DOTENV_CONFIG_QUIET: "true"
      PORT: "8080"
      # The OCR models (~139 MB, downloaded once and verified by hash) outlive the container here
      # instead of filling the /tmp tmpfs with memory — host.sh creates the directory for uid 1000.
      DOC_OCR_CACHE_DIR: /var/cache/silvicom/ocr-models
      RAILWAY_DEPLOYMENT_DRAINING_SECONDS: ${DRAIN_SECONDS}
      # Who holds a scheduler lane, in the lease row (lib/schedulerLease.ts processHolderMeta) — what
      # Railway's own variables said there before AWS11. The region is the awslogs one above.
      SERVICE_NAME: api
      DEPLOY_ENVIRONMENT: ${ENV_NAME}
      DEPLOY_REGION: us-west-2
      # Until this server's cutover (AWS10 staging, AWS11 production) Railway keeps the scheduler
      # lanes: an AWS container that won the `egress` lease would poll WEX from an IP WEX has not
      # allowlisted yet. The lease would keep it to one poller either way (D-AWS8); this keeps it
      # on the host that works. <env>.env sets RUN_SCHEDULERS=true at cutover.
      RUN_SCHEDULERS_IN_PROCESS: ${RUN_SCHEDULERS:?}
      # D-RLY2's production shape: the api containers take only `egress` (the EFS work) and the
      # worker below takes `general`, so the HTTP processes carry no general scheduler work. On one
      # server every container leaves from the same Elastic IP, so WEX and Med-Stop (D-MS3) see one
      # address whichever container runs a lane — the split here is about load, not about IPs.
      SCHEDULER_LANES: egress
    deploy:
      replicas: ${API_REPLICAS:?}

  # The `general` lane (RLY6/RLY7's @fleetguard/worker, railway.worker.json). Same image and settings
  # file as api (the runbook's "copy api's variables"), its own start command.
  #
  # ⚠ worker.ts does not read RUN_SCHEDULERS_IN_PROCESS: a `scheduler` worker competes for its lanes
  # from the moment it starts. So the switch is how many copies run — deploy.sh derives
  # WORKER_REPLICAS from RUN_SCHEDULERS (0 until cutover). A worker started earlier could win
  # `general` from Railway and call Med-Stop from an address Med-Stop has not bound the key to.
  worker:
    <<: *app
    command: ["node", "--import", "tsx", "apps/api/src/worker.ts"]
    # No HTTP server, so no /healthz to ask: the check is that PID 1 is alive. That is the whole
    # signal — a worker that loses its lease exits (exitOnLostLease), and a crash restarts it
    # (restart: unless-stopped), as Railway's restartPolicyType ALWAYS did. It must be a real check,
    # not `disable: true`: Compose 2.40 (the servers') refuses `up --wait` on a disabled healthcheck
    # with "has no healthcheck configured" instead of waiting for "running", which failed the first
    # release that started a worker (v2026.10.27, 2026-10-27) and rolled it back.
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - type: bind
        source: /run/silvicom/api.env
        target: /run/settings.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/silvicom/ocr-models
        target: /var/cache/silvicom/ocr-models
        bind:
          create_host_path: false
    environment:
      DOTENV_CONFIG_PATH: /run/settings.env
      DOTENV_CONFIG_QUIET: "true"
      RAILWAY_DEPLOYMENT_DRAINING_SECONDS: ${DRAIN_SECONDS}
      SERVICE_NAME: worker # the lease row's holder, as for api
      DEPLOY_ENVIRONMENT: ${ENV_NAME}
      DEPLOY_REGION: us-west-2
      WORKER_ROLE: scheduler
      # The OCR models (~139 MB, downloaded once and verified by hash) outlive the container here
      # instead of filling the /tmp tmpfs with memory — host.sh creates the directory for uid 1000.
      DOC_OCR_CACHE_DIR: /var/cache/silvicom/ocr-models
      SCHEDULER_LANES: general
      # Belt and braces from the runbook: the SOAP poller is `egress`, which this process never
      # competes for, and this keeps it off even if the lane list is ever edited wrongly.
      EFS_SOAP_ENABLED: "false"
    deploy:
      replicas: ${WORKER_REPLICAS:?WORKER_REPLICAS is set by deploy.sh from RUN_SCHEDULERS}

  web:
    <<: *app
    # Q-AWS14 (b): the settings file is mounted, not passed as environment, so Docker stores only
    # this path. `create_host_path: false` makes a missing file (an empty tmpfs after a reboot,
    # before silvicom-boot.service has run) stop the container instead of starting it unconfigured.
    volumes:
      - type: bind
        source: /run/silvicom/web.env
        target: /run/settings.env
        read_only: true
        bind:
          create_host_path: false
    environment:
      DOTENV_CONFIG_PATH: /run/settings.env
      DOTENV_CONFIG_QUIET: "true"
      PORT: "8080"
      RAILWAY_DEPLOYMENT_DRAINING_SECONDS: ${DRAIN_SECONDS}
      RUN_SCHEDULERS_IN_PROCESS: "false" # the front door never runs schedulers (DEPLOYMENT.md)

  console:
    image: ${CONSOLE_IMAGE:?CONSOLE_IMAGE is set by deploy.sh}
    labels:
      silvicom.settings: ${SETTINGS_HASH:?SETTINGS_HASH is set by deploy.sh and boot.sh}
    restart: unless-stopped
    <<: *hardened
    tmpfs:
      - /tmp:size=64m,mode=1777 # tsx's compile cache (3 MB measured), as for x-app
    # Q-AWS14 (b): the settings file is mounted, not passed as environment, so Docker stores only
    # this path. `create_host_path: false` makes a missing file (an empty tmpfs after a reboot,
    # before silvicom-boot.service has run) stop the container instead of starting it unconfigured.
    volumes:
      - type: bind
        source: /run/silvicom/console.env
        target: /run/settings.env
        read_only: true
        bind:
          create_host_path: false
    environment:
      DOTENV_CONFIG_PATH: /run/settings.env
      DOTENV_CONFIG_QUIET: "true"
      PORT: "8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging: *logs

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # A changed Caddyfile recreates this container (deploy.sh writes the hash into release.env): Caddy
    # reads its config once at start, and `docker cp` onto the bind-mounted file is not a reload. Until
    # D-AWS17 nothing had changed the file since the first deploy, so nobody had needed this.
    labels:
      silvicom.caddyfile: ${CADDYFILE_HASH:?CADDYFILE_HASH is set by deploy.sh in release.env}
    <<: *hardened
    # The image starts Caddy as root; nothing it does needs that. It runs as an unprivileged uid of
    # its own (no name in the image, none needed) with exactly one capability, the one it uses:
    # NET_BIND_SERVICE for ports 80 and 443. That capability must be in the bounding set in any case
    # — the image's /usr/bin/caddy carries it as a file capability (cap_net_bind_service=+ep), and
    # the kernel refuses to exec a binary whose file capabilities the bounding set lacks: the first
    # hardened start on staging (2026-10-24, cap_drop ALL alone) looped on "exec /usr/bin/caddy:
    # operation not permitted". Measured after the fix, from /proc/1/status: uid 10001, CapEff
    # 0x400 (NET_BIND_SERVICE only), NoNewPrivs 1. host.sh gives the two volumes below to this uid
    # before the first hardened start — the certificates in them were written by root until then,
    # and Caddy must be able to read and renew them.
    user: "10001:10001"
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_HOST: ${WEB_HOST:?}
      API_HOST: ${API_HOST:?}
      CONSOLE_HOST: ${CONSOLE_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive a redeploy; losing them would mean re-issuing on every deploy and
      # running into Let's Encrypt's rate limits.
      - caddy_data:/data
      - caddy_config:/config
    # Without a healthcheck `up --wait` only waits for "running", and a Caddy that exits at config
    # load and restarts in a loop is "running" at some instants: release run 40382803078 printed
    # "caddy running" and "deployed" while ports 80/443 refused every connection, and only the web
    # verify timing out 25 minutes later noticed. The admin API (127.0.0.1:2019, Caddy's default)
    # answers only once the config is loaded, so this fails the deploy itself, in a minute.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      console:
        condition: service_healthy
    logging: *logs

volumes:
  caddy_data:
  caddy_config:
