# ─────────────────────────────────────────────────────────────────────────────────────────────────────
# ANOMALY RULE CATALOG — single source of truth (Phase 7 SSOT).
#
# This file is the ONE place a rule's static spec lives. `pnpm gen:rules` regenerates
# `catalog.generated.ts` from it (RULE_IDS, RuleId, SignalAxis, RULE_LABELS, SUPPRESSED_RULE_IDS,
# SIGNAL_META). CI fails if the committed generated file drifts from this catalog.
#
# What stays HAND-AUTHORED (business logic, not catalog data): the rule functions in rules.ts, the
# per-fill severity each emits, precision/gating conditions, and formatRuleId's fallback in ids.ts.
#
# Per-rule fields:
#   id         snake_case identifier (the RuleId union member). Order here == RULE_IDS order.
#   tier       grouping for humans/UI only (odometer_integrity | volume_capacity | efficiency |
#              behavioral | reefer). Not a runtime constant today — documents what was a comment.
#   axis       correlation axis for the multi-signal theft model (SignalAxis).
#   weight     0–100 directness-of-theft weight. 0 = never contributes to a case (data-quality only).
#   suppressed true = product decision to never raise this as an anomaly (facts stay on the txn).
#   label      human-readable label shown wherever the raw key would appear.
#   note       optional rationale (kept out of the generated code; documentation for maintainers).
# ─────────────────────────────────────────────────────────────────────────────────────────────────────

rules:
  # ── Tier 1 — odometer integrity ──────────────────────────────────────────────────────────────────
  - id: odometer_missing
    tier: odometer_integrity
    axis: odometer
    weight: 0
    suppressed: true
    label: Missing Odometer
    note: Blank odometer is a data gap, not misuse — weight 0 and suppressed.
  - id: odometer_regression
    tier: odometer_integrity
    axis: odometer
    weight: 55
    label: Odometer Regression
    note: DELIBERATE (WP2) — 55 sits just below the lone-review threshold (60), so a lone regression (usually an entry typo) never raises a case; it stays visible via fuel_transactions.case_signals ("why clear"). WP4 — tolerance (odometerToleranceMiles) absorbs entry noise, and OBD arbitration reroutes explained regressions (this entry matches OBD → prev was wrong → silent; this entry contradicts OBD → mismatch/entry-suspect classify it and the redundant regression is dropped). Revisit weight against WP9 disposition data.
  - id: odometer_stale
    tier: odometer_integrity
    axis: odometer
    weight: 25
    label: Stale Odometer
  - id: odometer_implausible_jump
    tier: odometer_integrity
    axis: odometer
    weight: 35
    label: Implausible Odometer Jump
    note: Instant-precision only (uses elapsed hours). WP4 — ENTERED-basis only; an OBD miles basis means the distance was really driven, so it never fires on telematics-verified spans.
  - id: odometer_daily_cap
    tier: odometer_integrity
    axis: odometer
    weight: 30
    label: Daily Mileage Cap Exceeded
    note: Date-precision (EFS) fallback (miles/day cap). WP4 — ENTERED-basis only (OBD-verified team ops legitimately exceed 1,000 mi/day and never flag); non-telematics team fleets should tune maxDailyMiles in settings.
  - id: odometer_mismatch
    tier: odometer_integrity
    axis: odometer
    weight: 45
    label: Odometer / Location Mismatch
    note: Cross-source ±tolerance reconciliation (the driver-accuracy check).
  - id: odometer_entry_suspect
    tier: odometer_integrity
    axis: odometer
    weight: 0
    label: Odometer Entry Needs Review
    note: Cross-source diff so large it's a data-entry typo / OBD glitch, not theft — weight 0. WP2 — its P-1 suppression of the consumption rules applies ONLY when the per-fill miles came from the entered odometer (an OBD-span basis keeps them alive), closing the enter-garbage-to-silence-checks evasion on telematics-covered trucks.
  - id: expected_odometer_band
    tier: odometer_integrity
    axis: consumption
    weight: 40
    label: Outside Expected Odometer Band
    note: Single-source — miles vs fuel-implied miles (axis is consumption, not odometer).

  # ── Tier 2 — volume vs capacity ──────────────────────────────────────────────────────────────────
  - id: exceeds_tank_capacity
    tier: volume_capacity
    axis: volume
    weight: 85
    label: Exceeds Tank Capacity
    note: WP-CAP — capacity now comes from resolveCapacity (sensor-measured physics > entered > billed-history) with a confidence tier; verified capacity fires at the tight org tolerance, an unverified entered number needs 15% overage (the 5–15% band goes to exceeds_capacity_unverified). A fill whose own raw sensor rise proves the fuel went in suppresses to record-fix instead of alerting. Still DEAD when no capacity source exists (capacityHealth surfaces the gap); a sensor-measured capacity now REVIVES detection on trucks with no entered capacity.
  - id: exceeds_capacity_unverified
    tier: volume_capacity
    axis: volume
    weight: 60
    label: Over Entered Capacity (Unverified)
    note: WP-CAP — review-grade companion to exceeds_tank_capacity for trucks WITHOUT a sensor-verified capacity; fires only in the configured-tolerance…15% overage band against the entered/billed-history capacity (weight 60 = lone review, never an alert-alone critical). Disappears once the sensor verifies capacity — the main rule then covers the band at the tight tolerance.
  - id: tank_space_exceeded
    tier: volume_capacity
    axis: volume
    weight: 90
    label: More Fuel Than Tank Could Hold
    note: Billed gallons > empty space in the tank before fueling (can't fit in THIS truck). WP-CAP — free space is computed against the RESOLVED capacity (sensor-measured when available), so a mistyped entered capacity no longer produces false criticals here.
  - id: implausible_topoff
    tier: volume_capacity
    axis: consumption
    weight: 50
    label: Implausible Top-Off
    note: Same gallons-vs-miles inequality as mpg_deviation — shares the consumption axis (P-3).
  - id: cumulative_overfuel
    tier: volume_capacity
    axis: consumption
    weight: 75
    label: Cumulative Overfueling
    note: Rolling-window gallons vs miles-burnable + a tank. WP5 DETECTION FLOOR (documented, deliberate) — the ceiling grants one full empty-to-full tank of slack + 10 gal per window, so sustained theft under ~one tank per 48h is invisible to THIS rule by design (precision over recall); per-fill tank rules + tank_fill_short carry that range where sensors allow. WP-ATTR — the window EXCLUDES fills whose vehicle attribution the driver's ELD logbook contradicts (the driver-changed-truck false-alert class), and the rule is suppressed entirely when THIS fill is attribution-suspect; corroborated misattributions (logbook + GPS agree) are auto-re-attributed and re-scored under the correct truck.

  # ── Tier 3 — efficiency ──────────────────────────────────────────────────────────────────────────
  - id: mpg_deviation
    tier: efficiency
    axis: consumption
    weight: 30
    label: MPG Deviation
    note: WP6 — cold-weather derate runs off the fill's REAL ambient temperature when backfilled (≤20°F +10, ≤32°F +5), max'd with the calendar fallback (only ever widens). Baseline excludes theft-contaminated fills (volume-axis signals / alert cases) so sustained theft can't drag the baseline down and self-normalize; a lone consumption-axis deviation still trains it (legit efficiency change must move the median).
  - id: mpg_sustained_decline
    tier: efficiency
    axis: consumption
    weight: 20
    label: Sustained MPG Decline
    note: WP6 — same temperature-aware derate as mpg_deviation.

  # ── Tier 4 — behavioral ──────────────────────────────────────────────────────────────────────────
  - id: rapid_repeat_fueling
    tier: behavioral
    axis: behavior
    weight: 40
    label: Rapid Repeat Fueling
    note: Instant-precision only. WP7 — same-STATION pairs are exempt (a pump pre-auth split purchase / pull-forward top-off is two swipes at one site, not a theft interval; volume stays covered by cumulative_overfuel + tank rules); different-site pairs fire with combined gallons in evidence. Unknown location never exempts. WP-BEH — same-site is judged by real pin DISTANCE (≤1 mi) when both fills carry coordinates; strings only as fallback (string matching wrongly exempted two different truck stops in one city and wrongly split one station's name variants).
  - id: impossible_travel
    tier: behavioral
    axis: location
    weight: 70
    label: Impossible Travel Between Fills
    note: WP-BEH — two fills whose station pins are ≥60 mi apart with an implied speed over maxPlausibleMph (both instants reliable, gap ≤24h). Near-proof of card sharing/cloning — one fill was made without the truck. Review-alone (70); alerts with one corroborating axis. Supersedes rapid_repeat_fueling for the same pair.
  - id: off_hours_fueling
    tier: behavioral
    axis: behavior
    weight: 20
    label: Off-Hours Fueling
    note: Instant-precision only. WP7 — judged in the STATION state's timezone (where the truck is), org tz fallback; an org that never configured hours gets the 24/7 sentinel (rule OFF) instead of a silently assumed 05:00–20:00 schedule.
  - id: unattributed_transaction
    tier: behavioral
    axis: behavior
    weight: 0
    suppressed: true
    label: Unattributed Transaction
    note: Fill not matched to a vehicle/driver — data gap, not misuse. Weight 0 and suppressed.
  - id: cost_outlier
    tier: behavioral
    axis: behavior
    weight: 15
    label: Cost Outlier
    note: WP7 — no longer dead-by-default. Org static bounds (when set) fire as before; otherwise a diesel tractor fill ≥35% over the regional (state, ±3-day) POSTED-diesel median from the global price layer fires on real market data. Above-market only (receipt inflation / collusion direction); needs ≥5 station samples, cash quotes never blended. Station-EXACT posted-price comparison deferred to a station-identity workpackage.
  - id: cost_line_mismatch
    tier: behavioral
    axis: behavior
    weight: 10
    label: Line Math Mismatch
    note: WP-BEH (weight corrected in the WP-BEH audit) — total_cost ≠ gallons × price/gal beyond max($5, 2%) — an import defect or a tampered receipt; either way the row's money math can't be trusted. Weight 10 (far below the lone-review threshold) so it NEVER raises a case alone but persists in the case_signals "why" surface — a suppressed weight-0 rule would have been filtered out before persistence and visible nowhere.
  - id: card_multi_vehicle
    tier: behavioral
    axis: behavior
    weight: 60
    label: Card Used on Multiple Vehicles
    note: WP3/WP3b — counted by true CARD identity (full/masked refs + control-id disambiguation, sameCardFill), never by driver. WP3b after 169 false alarms — a LEARNED assignment is computed AS OF THE FILL (dominant vehicle over the prior 60d) and is EVIDENCE-ONLY, never firing alone (era changes / slip-seat secondaries are not misuse); only a MANUAL fuel_cards assignment (human ground truth, recent-era fills) fires on a single mismatch. Classic ≥2-trucks-in-window split-use unchanged; Samsara driver-assignment reconcile still auto-clears one-driver-moved-trucks.
  - id: location_mismatch
    tier: behavioral
    axis: location
    weight: 50
    label: Location Mismatch
    note: Corroboration-only — telematics location is the least-reliable signal (weight below the lone-review threshold); never raises a case alone but reinforces a volume/consumption signal. WP-BEH — now DISTANCE-tiered on top of the state comparison; >25 mi truck-vs-station at a reliable instant fires (>100 mi = high severity), so a card used far away IN the same state is no longer invisible. Suspect station pins (systematic-offset learner) and unreliable instants never fire.
  - id: tank_fill_short
    tier: behavioral
    axis: volume
    weight: 60
    label: Tank Fill Short
    note: Telematics tank rose less than billed gallons (advisory; coarse sensor). WP-BEH — the tolerance is now PRECISION-SCALED per truck: 3σ of the truck's own observed/billed ratio history (learnTankSensorReliability.ratioSigma), clamped 8–30% of the bill, min 15 gal. A clean single-tank sensor's floor drops from ~30 gal to ~9 gal on a 100-gal bill; no learned sigma keeps the legacy 30% blanket. The residual floor below the per-fill band is carried by tank_chronic_short.
  - id: tank_chronic_short
    tier: behavioral
    axis: volume
    weight: 65
    label: Chronic Tank Shortfall
    note: WP-BEH — the sustained-small-skim detector (closes the documented WP5 floor). Sensor noise is symmetric, so a persistent one-direction shortfall summed across ≥6 measured fills — each individually inside the per-fill tolerance — is fuel repeatedly not entering this tank. Threshold max(25 gal, 1.5σ × window billed); gated on the learned-reliable sensor. Review-alone (65); alerts with one corroborating axis.
  - id: fuel_while_driver_home
    tier: behavioral
    axis: behavior
    weight: 50
    label: Fueled While Driver Home
    note: Corroboration-only (weight below the lone-review threshold — never raises a case alone). WP-BEH — two independent sources feed it, TMS home-time (opt-in, ±1-day buffer) and the driver's own ELD logbook (fill deep inside an extended off-duty/sleeper block, buffered from duty transitions so shift-start fueling never flags). Reinforces a volume/consumption signal — a card fueling while its driver demonstrably isn't working.

  # ── Tier A — reefer (trailer refrigeration) fuel integrity (reefer/ULSR events only) ─────────────
  - id: reefer_exceeds_capacity
    tier: reefer
    axis: reefer
    weight: 90
    label: Reefer Fill Exceeds Tank
    note: One ULSR purchase > reefer tank capacity — can't fit in the reefer.
  - id: reefer_overfuel_rate
    tier: reefer
    axis: reefer
    weight: 75
    label: Reefer Over-Fueling
    note: Rolling-window reefer gallons > a reefer could burn + a tank.
  - id: reefer_fuel_diversion
    tier: reefer
    axis: reefer
    weight: 60
    label: Reefer Fueled with ULSD
    note: Reefer-hauling truck buys ULSD but ~no reefer (ULSR) fuel → reefer fueled off ULSD.
