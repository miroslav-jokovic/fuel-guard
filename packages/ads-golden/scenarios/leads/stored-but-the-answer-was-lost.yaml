name: "The store commits and its answer is lost: the retry finds one lead, heals its verdicts, and the ring stays lost"
why: >
  leadSink.ts: verdicts are recorded "also on a duplicate: a retry after a crash between the store and the verdicts
  heals them". leadNotify.ts: a retry reads as a duplicate "which rings nobody either", so a lost ring stays lost, and
  lead_uncontacted is the second chance. One lead, with its verdicts, and no ring.
covers: [retry]
verifiedBy: "Claude (Lead intake L3), from leadSink.ts, leadNotify.ts"
timeline:
  - submit: { lead: l1 }
  - webhook: [l1]
  - store_answer_lost: 1
  - jobs: true
  - jobs: true
expect:
  stored: { l1: webhook }
  accepted: 1
  rung: []
  failures: ["jobs 1: l1 sink"]
