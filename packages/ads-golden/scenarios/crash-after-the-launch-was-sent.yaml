name: "The process dies after the launch was sent and recorded, before the campaign moved: the retry moves it, never launching twice"
why: >
  At-least-once delivery re-runs the step. The guard's launch row says succeeded, so launchStep reads
  it back instead of asking the guard again (the approval is single-use anyway), and the transition's
  own `started` row from the dead run is the one the retry completes (same key, transitions.ts).
covers: [crash]
verifiedBy: "Claude (7d), from runner.ts launchStep + transitions.ts"
campaigns:
  - { id: c1, state: paused }
approvals:
  - { campaign: c1, daily_budget_cents: 5000, lifetime_cap_cents: 50000 }
timeline:
  - approver: { campaign: c1, event: launch }
  - crash: { table: ads_campaigns, nth: 1 }        # the launching → live compare-and-set
  - settle: true
expect:
  states: { c1: live }
  last_error: { c1: null }
  ledger:
    c1:
      - "paused -launch-> launching succeeded"
      - "launch succeeded"
      - "launching -launched-> live succeeded"
  vendor: { launch: 1, pause: 0 }
